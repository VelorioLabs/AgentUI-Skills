[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentui"
version = "2.0.0"
description = "God-Level UI/UX Design Engine & Linter for AI Agents (Antigravity, Claude, Cursor)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "VelorioLabs", email = "engineering@velorio.io"}
]
keywords = ["ui", "ux", "design-system", "ai-agents", "claude", "cursor", "antigravity"]

[project.scripts]
agentui = "agentui.cli:main"
